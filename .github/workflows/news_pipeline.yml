name: Ignis News Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-translate-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install feedparser requests deep-translator trafilatura beautifulsoup4 lxml openai
    
    - name: Collect news
      run: python scripts/collect_news.py
    
    - name: Translate news
      run: python scripts/translate_news.py
    
    - name: Publish to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python scripts/publish_to_telegram.py
    
    - name: Copy feed for site (every 2 hours)
      run: |
        HOUR=$(date -u +%H)
        if [ $((10#$H % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ -f src/content/site_feed.json ]; then
            cp src/content/site_feed.json docs/news.json
            echo "🌐 Site feed updated"
          fi
        else
          echo "⏭️ Site update skipped this hour (next: even hour)"
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add src/content/ docs/news.json
        git diff --staged --quiet || git commit -m "Update news [skip ci]"
        git push