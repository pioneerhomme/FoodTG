<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Office - Новости с ИИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stats h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .article {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .article:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .article h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .article h3 a {
            color: #667eea;
            text-decoration: none;
        }
        
        .article h3 a:hover {
            text-decoration: underline;
        }
        
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .source {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .article {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI News Office</h1>
            <p>Автоматический сбор новостей с помощью ИИ</p>
        </header>
        
        <div class="stats" id="stats">
            <h2>📊 Статистика</h2>
            <p id="stats-text">Загрузка...</p>
        </div>
        
        <div class="news-list" id="news">
            <div class="loading">Загрузка новостей...</div>
        </div>
        
        <button class="refresh-btn" onclick="loadNews()">🔄 Обновить</button>
    </div>

    <script>
        let allArticles = [];
        
        async function loadNews() {
            const newsDiv = document.getElementById('news');
            const statsText = document.getElementById('stats-text');
            
            try {
                // Загружаем данные из JSON файла
                const response = await fetch('../src/content/news_translated.json');
                
                if (!response.ok) {
                    throw new Error('Файл не найден');
                }
                
                allArticles = await response.json();
                
                // Обновляем статистику
                const sources = [...new Set(allArticles.map(a => a.source))];
                statsText.innerHTML = `
                    Всего новостей: <strong>${allArticles.length}</strong> | 
                    Источников: <strong>${sources.length}</strong> | 
                    Обновлено: <strong>${new Date().toLocaleString('ru-RU')}</strong>
                `;
                
                // Отображаем новости (последние 20)
                newsDiv.innerHTML = '';
                
                allArticles.slice(0, 20).forEach(article => {
                    const title = article.title_ru || article.title;
                    const published = article.published ? new Date(article.published).toLocaleString('ru-RU') : '';
                    
                    newsDiv.innerHTML += `
                        <div class="article">
                            <h3><a href="${article.link}" target="_blank" rel="noopener">${title}</a></h3>
                            <div class="meta">
                                <span class="source">${article.source}</span>
                                <span>${published}</span>
                            </div>
                        </div>
                    `;
                });
                
                // Если новостей больше 20, показываем кнопку "загрузить ещё"
                if (allArticles.length > 20) {
                    newsDiv.innerHTML += `
                        <button class="refresh-btn" onclick="showAll()" style="width:100%">
                            📚 Показать все ${allArticles.length} новостей
                        </button>
                    `;
                }
                
            } catch (error) {
                newsDiv.innerHTML = `
                    <div class="error">
                        ❌ Ошибка загрузки новостей: ${error.message}<br>
                        Попробуйте обновить страницу позже.
                    </div>
                `;
                console.error('Ошибка:', error);
            }
        }
        
        function showAll() {
            const newsDiv = document.getElementById('news');
            newsDiv.innerHTML = '';
            
            allArticles.forEach(article => {
                const title = article.title_ru || article.title;
                const published = article.published ? new Date(article.published).toLocaleString('ru-RU') : '';
                
                newsDiv.innerHTML += `
                    <div class="article">
                        <h3><a href="${article.link}" target="_blank" rel="noopener">${title}</a></h3>
                        <div class="meta">
                            <span class="source">${article.source}</span>
                            <span>${published}</span>
                        </div>
                    </div>
                `;
            });
        }
        
        // Загружаем новости при открытии страницы
        loadNews();
        
        // Автоматическое обновление каждые 5 минут
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
