<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNIS — горячие новости</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #eef1f5;
        color: #14141a;
        min-height: 100vh;
    }
    header {
        background: #fff;
        border-bottom: 1px solid #e2e6ec;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
    }
    .logo {
        font-size: 1.4em;
        font-weight: 900;
        letter-spacing: 1px;
    }
    .logo em { font-style: normal; color: #ff4d00; }
    .subscribe {
        background: #14141a;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92em;
        padding: 10px 20px;
        border-radius: 24px;
        transition: transform .15s;
    }
    .subscribe:hover { transform: scale(1.05); }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 {
        font-size: 1.7em;
        font-weight: 800;
        margin-bottom: 24px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
    .card {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        background: #14141a;
        min-height: 340px;
        display: flex;
        align-items: flex-end;
        box-shadow: 0 6px 20px rgba(20,20,30,.12);
        transition: transform .2s, box-shadow .2s;
    }
    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(20,20,30,.2);
    }
    .card.featured {
        grid-column: 1 / -1;
        min-height: 440px;
    }
    .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(.6) saturate(.9);
    }
    .badges {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
        z-index: 2;
    }
    .badge {
        font-size: 0.78em;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 16px;
    }
    .badge.fresh {
        background: #2ee6a8;
        color: #0c2b20;
    }
    .badge.fresh::before { content: "● "; font-size: 0.8em; }
    .badge.cat {
        background: rgba(20,20,26,.8);
        color: #fff;
        backdrop-filter: blur(4px);
    }
    .overlay {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 110px 22px 20px;
        background: linear-gradient(to top,
            rgba(8,8,12,.98) 25%,
            rgba(8,8,12,.88) 55%,
            rgba(8,8,12,.45) 85%,
            transparent 100%);
        color: #fff;
    }
    .overlay h3 {
        font-size: 1.2em;
        font-weight: 800;
        line-height: 1.35;
        margin-bottom: 8px;
        text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .card.featured .overlay h3 { font-size: 1.7em; }
    .overlay p {
        font-size: 0.93em;
        line-height: 1.5;
        color: rgba(255,255,255,.92);
        text-shadow: 0 1px 3px rgba(0,0,0,.7);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .loading, .empty {
        grid-column: 1 / -1;
        text-align: center;
        color: #8a93a3;
        padding: 80px 0;
        font-size: 1.1em;
    }
    footer {
        text-align: center;
        color: #9aa3b2;
        font-size: 0.85em;
        padding: 24px;
    }
    @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
        .card.featured { min-height: 360px; }
    }
    @media (max-width: 600px) {
        .grid { grid-template-columns: 1fr; }
        h1 { font-size: 1.35em; }
        .overlay { padding-top: 80px; }
    }
</style>
</head>
<body>
<header>
    <div class="logo">🔥 IG<em>NIS</em></div>
    <a class="subscribe" href="https://t.me/ignisnovosti" target="_blank">🔔 Подписаться</a>
</header>
<main>
    <h1>Для тех, кто хочет знать первым</h1>
    <div class="grid" id="feed"><div class="loading">Загрузка новостей...</div></div>
</main>
<footer>IGNIS • свежие новости каждый день</footer>
<script>
function cardHTML(p, featured) {
    const img = p.image ? `<img src="${p.image}" alt="" loading="lazy" onerror="this.remove()">` : '';
    const cat = (p.hashtags || '').split(' ')[0] || '#новости';
    const text = p.text || '';
    return `
    <article class="card${featured ? ' featured' : ''}">
        ${img}
        <div class="badges">
            <span class="badge fresh">Свежее</span>
            <span class="badge cat">${cat}</span>
        </div>
        <div class="overlay">
            <h3>${p.title}</h3>
            <p>${text}</p>
        </div>
    </article>`;
}

async function loadFeed() {
    const feed = document.getElementById('feed');
    try {
        const resp = await fetch('news.json?ts=' + Date.now());
        if (!resp.ok) throw new Error();
        const posts = await resp.json();
        if (!posts.length) {
            feed.innerHTML = '<div class="empty">Новости уже в пути — загляните через пару минут</div>';
            return;
        }
        feed.innerHTML =
            cardHTML(posts[0], true) +
            posts.slice(1, 13).map(p => cardHTML(p, false)).join('');
    } catch (e) {
        feed.innerHTML = '<div class="empty">Лента ещё наполняется. Загляните чуть позже 🙂</div>';
    }
}
loadFeed();
setInterval(loadFeed, 5 * 60 * 1000);
</script>
</body>
</html>
