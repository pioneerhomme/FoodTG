<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignis — простые и вкусные рецепты</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #e7ebf0; color: #000; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 8px 60px; }
    .channel { background: #fff; border-radius: 10px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
    .ava { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #ff9a3d, #ff4d00); display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; }
    .ch h1 { font-size: 1.15em; }
    .ch .sub { color: #7d8b99; font-size: .85em; margin: 2px 0 8px; }
    .btn { display: inline-block; background: #5288c1; color: #fff; text-decoration: none; font-size: .85em; font-weight: 600; padding: 7px 16px; border-radius: 6px; }
    .ch .user { color: #7d8b99; font-size: .82em; margin-left: 8px; }
    .tags { background: #fff; border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tg-btn { border: none; background: #e7ebf0; color: #5288c1; font-size: .8em; font-weight: 600; padding: 5px 12px; border-radius: 14px; cursor: pointer; }
    .tg-btn.active { background: #5288c1; color: #fff; }
    .post { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .post h3 { font-size: 1.05em; margin: 10px 0 6px; }
    .app { color: #555; font-style: italic; font-size: .92em; line-height: 1.45; margin-bottom: 10px; }
    .post h4 { font-size: .9em; margin: 10px 0 4px; color: #333; }
    .post ul, .post ol { padding-left: 20px; font-size: .9em; line-height: 1.5; color: #222; }
    .post img { width: 100%; border-radius: 8px; max-height: 420px; object-fit: cover; }
    .foot { margin-top: 10px; color: #7d8b99; font-size: .8em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .kjbu { color: #e05c2a; font-weight: 700; }
    .ptags button { border: none; background: none; color: #5288c1; font-size: .85em; font-weight: 600; cursor: pointer; padding: 0 2px; }
    .empty { text-align: center; color: #7d8b99; padding: 50px 0; }
</style>
</head>
<body>
<div class="wrap">
    <div class="channel">
        <div class="ava">🍲</div>
        <div class="ch">
            <h1>Ignis</h1>
            <div class="sub"><span id="count">—</span> рецептов · Еда и напитки</div>
            <a class="btn" href="https://t.me/ignisnovosti" target="_blank">🔔 Подписаться</a>
            <span class="user">@ignisnovosti</span>
        </div>
    </div>
    <div class="tags" id="tags"></div>
    <div id="feed"><div class="empty">Загрузка...</div></div>
</div>
<script>
let POSTS = [], TAG = '';
function imgTag(url) {
    if (!url) return '';
    if (!url.startsWith('http')) return `<img src="${url}" loading="lazy">`;
    return `<img src="${url}" loading="lazy" referrerpolicy="no-referrer" onerror="if(!this.dataset.p){this.dataset.p=1;this.src='https://images.weserv.nl/?url='+encodeURIComponent(this.src);}else{this.remove();}">`;
}
function postHTML(p) {
    const img = imgTag(p.image);
    const ing = (p.ingredients||[]).length ? `<h4>🥄 Ингредиенты</h4><ul>${p.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>` : '';
    const stp = (p.steps||[]).length ? `<h4>👩‍ Приготовление</h4><ol>${p.steps.map((s,i)=>`<li>${i+1}. ${s}</li>`).join('')}</ol>` : '';
    const k = p.kjbu||{};
    const kjbu = k.kcal ? `<span class="kjbu">🔥 ${k.estimated?'≈':''}${k.kcal} ккал • Б${k.proteins} Ж${k.fats} У${k.carbs}</span>` : '';
    const tm = p.time_minutes ? `<span>⏱ ${p.time_minutes} мин</span>` : '';
    const tg = (p.tags||[]).map(t=>`<button onclick="setTag('${t}')">#${t}</button>`).join(' ');
    return `<article class="post">
        ${img}
        <h3>🍲 ${p.name}</h3>
        <div class="app">${p.appetizing}</div>
        ${ing}${stp}
        <div class="foot"><span>${tm} ${kjbu}</span></div>
        <div class="foot"><span class="ptags">${tg}</span></div>
    </article>`;
}
function render() {
    const list = TAG ? POSTS.filter(p=>(p.tags||[]).includes(TAG)) : POSTS;
    document.getElementById('feed').innerHTML =
        list.length ? list.map(postHTML).join('') : '<div class="empty">По тегу пока пусто 🙂</div>';
}
function setTag(t) { TAG = (TAG === t) ? '' : t; drawTags(); render(); }
function drawTags() {
    const c = {};
    POSTS.forEach(p=>(p.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
    const tags = ['завтрак','обед','ужин','десерт'].filter(t=>c[t]);
    document.getElementById('tags').innerHTML =
        `<button class="tg-btn ${TAG?'':'active'}" onclick="setTag('')">Все</button>` +
        tags.map(t=>`<button class="tg-btn ${TAG===t?'active':''}" onclick="setTag('${t}')">#${t} ${c[t]}</button>`).join('');
}
async function load() {
    try {
        const r = await fetch('news.json?ts='+Date.now());
        POSTS = await r.json();
        document.getElementById('count').textContent = POSTS.length;
        drawTags(); render();
    } catch(e) {
        document.getElementById('feed').innerHTML = '<div class="empty">Лента наполняется 🙂</div>';
    }
}
load();
setInterval(load, 30*60*1000);
</script>
</body>
</html>
