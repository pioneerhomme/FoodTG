<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNIS — горячие новости</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f6f7f9;
        color: #14141a;
        min-height: 100vh;
    }
    header {
        background: #fff;
        border-bottom: 1px solid #e8ebf0;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
    }
    .logo { font-size: 1.4em; font-weight: 900; letter-spacing: 1px; }
    .logo em { font-style: normal; color: #ff4d00; }
    .subscribe {
        background: #ff4d00;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92em;
        padding: 10px 22px;
        border-radius: 24px;
        box-shadow: 0 4px 14px rgba(255,77,0,.3);
        transition: transform .15s;
    }
    .subscribe:hover { transform: scale(1.05); }
    main { max-width: 860px; margin: 0 auto; padding: 36px 18px 60px; }
    h1 { font-size: 1.6em; font-weight: 800; margin-bottom: 24px; }
    .card {
        display: flex;
        gap: 22px;
        background: #fff;
        border: 1px solid #e8ebf0;
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 16px;
        box-shadow: 0 1px 3px rgba(20,20,30,.05);
        transition: box-shadow .2s, transform .2s;
    }
    .card:hover {
        box-shadow: 0 8px 24px rgba(20,20,30,.09);
        transform: translateY(-2px);
    }
    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .chip {
        font-size: 0.76em;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
    }
    .time { color: #9aa3b2; font-size: 0.8em; }
    .card h3 {
        font-size: 1.25em;
        font-weight: 800;
        line-height: 1.35;
        margin-bottom: 8px;
    }
    .card p {
        color: #5c6675;
        line-height: 1.6;
        font-size: 0.97em;
    }
    .thumb {
        width: 280px;
        height: 190px;
        object-fit: cover;
        border-radius: 12px;
        flex-shrink: 0;
    }
    .card.featured { padding: 28px; }
    .card.featured h3 { font-size: 1.7em; }
    .card.featured p { font-size: 1.05em; }
    .card.featured .thumb { width: 380px; height: 260px; }
    .loading, .empty {
        text-align: center;
        color: #8a93a3;
        padding: 80px 0;
        font-size: 1.1em;
    }
    footer { text-align: center; color: #9aa3b2; font-size: 0.85em; padding: 24px; }
    @media (max-width: 700px) {
        .card { flex-direction: column-reverse; }
        .thumb, .card.featured .thumb { width: 100%; height: 210px; }
        .card.featured h3 { font-size: 1.35em; }
        h1 { font-size: 1.3em; }
    }
</style>
</head>
<body>
<header>
    <div class="logo">🔥 IG<em>NIS</em></div>
    <a class="subscribe" href="https://t.me/ignisnovosti" target="_blank">🔔 Подписаться</a>
</header>
<main>
    <h1>Для тех, кто хочет знать первым</h1>
    <div id="feed"><div class="loading">Загрузка новостей...</div></div>
</main>
<footer>IGNIS • свежие новости каждый день</footer>
<script>
const CAT_COLORS = {
    'технологии': '#2563eb',
    'экономика': '#059669',
    'происшествия': '#dc2626',
    'политика': '#7c3aed',
    'общество': '#ea580c',
    'наука': '#0891b2',
    'спорт': '#16a34a',
    'шоубиз': '#db2777',
    'вмире': '#4f46e5',
};

function chipStyle(tag) {
    const c = CAT_COLORS[tag.replace('#', '')] || '#64748b';
    return `background:${c}1a;color:${c}`;
}

function cardHTML(p, featured) {
    const img = p.image ? `<img class="thumb" src="${p.image}" alt="" loading="lazy" onerror="this.remove()">` : '';
    const tag = (p.hashtags || '').split(' ')[0] || '#новости';
    const time = p.time ? new Date(p.time).toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : '';
    return `
    <article class="card${featured ? ' featured' : ''}">
        <div class="content">
            <div class="meta">
                <span class="chip" style="${chipStyle(tag)}">${tag}</span>
                <span class="time">${time}</span>
            </div>
            <h3>${p.title}</h3>
            <p>${p.text}</p>
        </div>
        ${img}
    </article>`;
}

async function loadFeed() {
    const feed = document.getElementById('feed');
    try {
        const resp = await fetch('news.json?ts=' + Date.now());
        if (!resp.ok) throw new Error();
        const posts = await resp.json();
        if (!posts.length) {
            feed.innerHTML = '<div class="empty">Новости уже в пути — загляните через пару минут</div>';
            return;
        }
        feed.innerHTML =
            cardHTML(posts[0], true) +
            posts.slice(1, 15).map(p => cardHTML(p, false)).join('');
    } catch (e) {
        feed.innerHTML = '<div class="empty">Лента ещё наполняется. Загляните чуть позже 🙂</div>';
    }
}
loadFeed();
setInterval(loadFeed, 5 * 60 * 1000);
</script>
</body>
</html>
