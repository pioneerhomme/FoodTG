<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 AI News Office — новости с иронией</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f14;
        color: #e8e8ec;
        min-height: 100vh;
    }
    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(15,15,20,0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #26262e;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .logo { font-size: 1.25em; font-weight: 800; }
    .logo span { color: #ff7a00; }
    .subscribe {
        background: linear-gradient(135deg, #ff7a00, #ff3d00);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 24px;
        white-space: nowrap;
        transition: transform .15s;
    }
    .subscribe:hover { transform: scale(1.05); }
    main {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px 14px 60px;
    }
    .card {
        background: #1a1a22;
        border: 1px solid #26262e;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 18px;
    }
    .card img {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        display: block;
    }
    .card-body { padding: 16px 18px 14px; }
    .card h3 {
        font-size: 1.1em;
        line-height: 1.35;
        margin-bottom: 10px;
    }
    .card p {
        color: #b9b9c4;
        line-height: 1.5;
        font-size: 0.97em;
        margin-bottom: 12px;
    }
    .tags { color: #6f8cff; font-size: 0.88em; }
    .time { color: #63636e; font-size: 0.8em; margin-top: 8px; }
    .loading, .empty {
        text-align: center;
        color: #63636e;
        padding: 60px 0;
        font-size: 1.1em;
    }
    footer {
        text-align: center;
        color: #4a4a55;
        font-size: 0.85em;
        padding: 20px;
    }
</style>
</head>
<body>
<header>
    <div class="logo">🔥 AI News <span>Office</span></div>
    <a class="subscribe" href="https://t.me/allnewsin" target="_blank">🔔 Подписаться</a>
</header>
<main>
    <div id="feed"><div class="loading">Загрузка новостей...</div></div>
</main>
<footer>Новости собирает и переписывает ИИ • обновляется каждые 4 часа</footer>
<script>
async function loadFeed() {
    const feedDiv = document.getElementById('feed');
    try {
        const resp = await fetch('news.json?ts=' + Date.now());
        if (!resp.ok) throw new Error('нет файла');
        const posts = await resp.json();
        if (!posts.length) {
            feedDiv.innerHTML = '<div class="empty">Пока нет новостей — загляните позже</div>';
            return;
        }
        feedDiv.innerHTML = posts.map(p => {
            const img = p.image ? `<img src="${p.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
            const time = p.time ? new Date(p.time).toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : '';
            return `
            <div class="card">
                ${img}
                <div class="card-body">
                    <h3>🔥 ${p.title}</h3>
                    <p>${p.text}</p>
                    <div class="tags">${p.hashtags}</div>
                    <div class="time">${time}</div>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        feedDiv.innerHTML = '<div class="empty">Новости ещё собираются. Загляните через пару минут 🙂</div>';
    }
}
loadFeed();
setInterval(loadFeed, 5 * 60 * 1000);
</script>
</body>
</html>
